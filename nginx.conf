# Cache-Control lives in a map rather than per-location add_header: an add_header inside a location
# block discards every header inherited from the server block, which silently dropped the security
# headers below on exactly the pages that matter. First matching entry wins.
map $uri $cache_control {
    default                                    "public, max-age=0, must-revalidate";
    ~^/_next/static/                           "public, max-age=31536000, immutable"; # next content-hashes these
    ~/index\.html$                             "no-cache, no-store, must-revalidate"; # so a deploy is picked up at once
    ~\.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ "public, max-age=2592000";
}

server {
    listen 8080; # 80 needs root; the unprivileged image cannot bind it
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html; # next's static export renders a real 404 page

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # No inline scripts and next/font self-hosts at build time, so most origins stay 'self'.
    # form-action allows formsubmit.co (the kontakt page's contact form) and frame-src allows
    # Google Maps (the embedded map on the same page). Check both before adding another embed.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self' https://formsubmit.co; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TLS terminates at the ingress; this header still reaches the browser through it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;

    # Kubernetes probes, so they do not depend on the page content.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
