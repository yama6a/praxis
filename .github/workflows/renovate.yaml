# Self-hosted Renovate. Reads /renovate.json5 from the cloned repo automatically.
name: Renovate

on:
  schedule:
    # Automerge needs frequent runs: Renovate opens the PR on one run and merges it on the NEXT one (if CI passes).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Dry run (extract + plan, open no PRs)
        default: false
        type: boolean

jobs:
  renovate:
    uses: yama6a/gha/.github/workflows/renovate.yaml@v1
    with:
      log-level: ${{ inputs.logLevel || 'info' }}
      dry-run: ${{ inputs.dryRun || false }}
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
